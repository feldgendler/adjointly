name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Node release line in LTS; the minimum is package.json's engines.node.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run example

  mutation:
    name: mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Fails when the mutation score drops below thresholds.break in stryker.config.json.
      - run: npm run mutate
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore

  bench:
    name: benchmark regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the base commit is needed too
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Head against base on this one runner, in alternating rounds (bench/ab.ts). The base is the
      # pull request's base commit, or, on a push to main, the commit main was at before the push.
      # A new branch has no "before" (all zeros); there is nothing to compare, so the job skips.
      - name: Choose the base commit
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare with; skipping."
          else
            echo "sha=$base" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.base.outputs.sha
        run: git worktree add "$RUNNER_TEMP/base" "${{ steps.base.outputs.sha }}"
      - if: steps.base.outputs.sha
        run: npm run bench:ab -- --base "$RUNNER_TEMP/base" --rounds 5
        env:
          BENCH_WARN: '1.10'
          BENCH_FAIL: '1.25'
