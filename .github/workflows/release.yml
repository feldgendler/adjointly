name: Release

# Inert while the package is private: the job only runs when the repository variable
# RELEASE_ENABLED is 'true', and a guard step refuses to go on while package.json says
# "private": true. To release: decide the license, remove "private", configure npm trusted
# publishing for this repository and workflow on npmjs.com, then set RELEASE_ENABLED.
#
# Publishing uses npm trusted publishing (OIDC): no NPM_TOKEN secret. The id-token permission
# lets npm exchange the workflow's identity for a short-lived publish credential, and publishes
# from it carry provenance automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: release

jobs:
  release:
    if: ${{ vars.RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # version commits and tags
      pull-requests: write # the "Version packages" pull request
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Trusted publishing needs npm 11.5.1 or later, which Node 24 and later ship.
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Refuse to publish a private package
        run: |
          if [ "$(node -p "require('./package.json').private === true")" = "true" ]; then
            echo "::error::package.json is private; remove \"private\" before enabling releases"
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      # With pending changesets this opens or updates a "Version packages" pull request; once that
      # is merged, it publishes the new version. v2 of the action: inputs are `*-script`,
      # `commit-message`, `pr-title`; the token is the `github-token` input (default: this
      # workflow's GITHUB_TOKEN; an env var is no longer read); commits and tags are pushed through
      # the GitHub API; and it needs @changesets/cli 3, which package.json has. `npm run release`
      # runs `changeset publish` with the environment the action sets (CHANGESETS_OUTPUT), which
      # is how it learns what was published.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: 'Version packages'
          pr-title: 'Version packages'
